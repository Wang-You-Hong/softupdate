name: Discord 更新播報

on:
  release:
    types: [edited, published]
  workflow_dispatch:
    inputs:
      release_name:
        description: "要播報的版本，例如 v1.4.3"
        required: true
        default: "v1.4.3"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          content: ${{ secrets.DISCORD_MENTION }}
          username: HaWaTool 更新
          color: "3447003"
          release_name: ${{ github.event.inputs.release_name || github.event.release.tag_name }}
