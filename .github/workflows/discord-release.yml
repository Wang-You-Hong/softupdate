name: Discord 更新播報

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取最新 Release
        id: rel
        env:
          EVENT: ${{ github.event_name }}
        run: |
          DATA=$(curl -sS -H "User-Agent: HaWaTool" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          echo "$DATA" > /tmp/rel.json
          TAG=$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('tag_name',''))")
          UPD=$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('updated_at',''))")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "updated=$UPD" >> $GITHUB_OUTPUT
          if [ "$EVENT" = "schedule" ]; then
            python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          upd = os.environ.get("UPD") or open("/tmp/upd.txt").read() if False else None
          PY
          fi
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rel = json.load(open("/tmp/rel.json"))
          event = os.environ["EVENT"]
          if event == "schedule":
              ts = datetime.fromisoformat(rel["updated_at"].replace("Z","+00:00"))
              if (datetime.now(timezone.utc) - ts).total_seconds() > 15*60:
                  open("/tmp/skip","w").write("1")
                  print("略過")
          body = (rel.get("body") or "")[:1200]
          mention = os.environ.get("MENTION","")
          lines = []
          if mention.strip():
              lines.append(mention.strip())
          lines.append(f"**HaWaTool 更新播報：{rel.get('tag_name')}**")
          lines.append(rel.get("html_url") or "")
          if body:
              lines.append("")
              lines.append(body)
          json.dump({"content":"\n".join(lines),"allowed_mentions":{"parse":["roles","everyone","users"]}}, open("/tmp/payload.json","w"), ensure_ascii=False)
          PY
        env:
          EVENT: ${{ github.event_name }}
          MENTION: ${{ secrets.DISCORD_MENTION }}

      - name: 送到 Discord
        if: hashFiles('/tmp/skip') == ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          test -n "$WEBHOOK" || { echo "缺少 DISCORD_WEBHOOK"; exit 1; }
          curl -sS -f \
            -A "Mozilla/5.0 (compatible; HaWaTool/1.0)" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "$WEBHOOK"
          echo
          echo "已發送"
