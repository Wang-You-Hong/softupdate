name: Discord 更新播報

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 送到 Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MENTION: ${{ secrets.DISCORD_MENTION }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, traceback, urllib.error, urllib.request
          from datetime import datetime, timezone

          try:
              webhook = (os.environ.get("WEBHOOK") or "").strip()
              if not webhook.startswith("https://discord.com/api/webhooks/"):
                  raise SystemExit("DISCORD_WEBHOOK 沒設或不是 Discord Webhook 網址")

              repo = os.environ.get("REPO") or "Wang-You-Hong/softupdate"
              event = os.environ.get("EVENT") or ""

              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers={
                      "User-Agent": "HaWaTool-Announce",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rel = json.loads(resp.read().decode("utf-8"))

              if event == "schedule":
                  updated = rel.get("updated_at") or rel.get("published_at") or ""
                  ts = datetime.fromisoformat(updated.replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - ts).total_seconds()
                  if age > 15 * 60:
                      print("最近沒更新 Release，略過")
                      raise SystemExit(0)

              mention = (os.environ.get("MENTION") or "").strip()
              tag = rel.get("tag_name") or ""
              url = rel.get("html_url") or ""
              body = (rel.get("body") or "").strip()
              if len(body) > 1200:
                  body = body[:1200] + "…"

              lines = []
              if mention:
                  lines.append(mention)
              lines.append(f"**HaWaTool 更新播報：{tag}**")
              if url:
                  lines.append(url)
              if body:
                  lines.append("")
                  lines.append(body)

              payload = json.dumps({
                  "content": "\n".join(lines),
                  "allowed_mentions": {"parse": ["roles", "everyone", "users"]},
              }).encode("utf-8")
              req = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Discord HTTP", resp.status)
              print("已發送", tag)
          except urllib.error.HTTPError as e:
              print("HTTPError", e.code, e.read()[:300])
              raise
          except Exception:
              traceback.print_exc()
              raise
          PY
